<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Milogic-Jev — демо</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #f7f5f2; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.2rem; margin: 1rem 0; }
  .tag { display: inline-block; background: #eee; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-right: 0.4rem; }
  button { padding: 0.4rem 0.8rem; margin: 0.2rem; cursor: pointer; }
  .scene { font-style: italic; color: #444; }
</style>
</head>
<body>
<h1>Milogic-Jev — интерактивное демо</h1>
<p>Слои: домены, носители alice-snov, микро-архетипы.</p>

<div class="card">
  <strong>Домен</strong><br>
  <button onclick="showDomain('services')">services</button>
  <button onclick="showDomain('trade')">trade</button>
  <button onclick="showDomain('finance')">finance</button>
  <div id="domain-out"></div>
</div>

<div class="card">
  <strong>Носитель</strong><br>
  <button onclick="showCarrier('ski_rocker')">Кресло-лыжи</button>
  <button onclick="showCarrier('hat')">Шляпа</button>
  <button onclick="showCarrier('snowflake')">Снежинка</button>
  <div id="carrier-out"></div>
</div>

<div class="card">
  <strong>Микро-архетип</strong><br>
  <button onclick="showMicro()">Показать шестерёнки</button>
  <div id="micro-out"></div>
</div>

<script>
const domains = {
  services: [
    { a: "экспертиза", b: "доставка результата" },
    { a: "потребность клиента", b: "процесс оказания" }
  ],
  trade: [
    { a: "товар", b: "канал" },
    { a: "маржа", b: "оборот" }
  ],
  finance: [
    { a: "риск", b: "доходность" },
    { a: "ликвидность", b: "обязательства" }
  ]
};

const carriers = {
  ski_rocker: { name: "Кресло-лыжи", a: "осцилляция", b: "трансляция", zero: "снятые ботинки", geo: "кривая" },
  hat: { name: "Шляпа", a: "надеть", b: "разложить", zero: "пустой цилиндр", geo: "цилиндр" },
  snowflake: { name: "Снежинка", a: "вверх", b: "падение", zero: "молчание", geo: "дендрит" }
};

function showDomain(name) {
  const items = domains[name] || [];
  let html = `<p>Домен <span class="tag">${name}</span></p>`;
  items.forEach(it => {
    html += `<div class="scene">«${it.a} ↔ ${it.b}»</div>`;
  });
  document.getElementById("domain-out").innerHTML = html;
}

function showCarrier(id) {
  const c = carriers[id];
  if (!c) return;
  document.getElementById("carrier-out").innerHTML =
    `<p><span class="tag">${c.name}</span> (${c.geo})</p>` +
    `<div class="scene">Режим A: ${c.a} · Режим B: ${c.b}<br>Zero: ${c.zero}</div>`;
}

function showMicro() {
  const gears = [
    { name: "Проверка", obj: "маленькая шестерёнка" },
    { name: "Запуск", obj: "средняя шестерёнка" },
    { name: "Закрепление", obj: "стопорная шестерёнка" }
  ];
  let html = "";
  gears.forEach(g => {
    html += `<div class="scene">${g.name} — ${g.obj}</div>`;
  });
  document.getElementById("micro-out").innerHTML = html;
}
</script>
</body>
</html>
